<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Sharp Cuts</title>

  <link rel="stylesheet" href="assets/css/style.css" />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

</head>

<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="assets/img/logo.png" alt="Sharp Cuts Logo" height="55" />
        <h2>Welcome Back</h2>
        <p>Login to book appointments and shop products</p>
      </div>

      <form id="loginForm">
        <div class="mb-3">
          <label for="login_email" class="form-label">Email Address</label>
          <input
            type="email"
            class="form-control"
            id="login_email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="mb-2">
          <label for="login_password" class="form-label">Password</label>
          <div class="input-group">
            <input
              type="password"
              class="form-control"
              id="login_password"
              placeholder="Enter your password"
              required
            />
            <button type="button" class="btn" id="toggleLoginPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="text-end mb-3">
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-gold w-100">
          Login
        </button>
      </form>

      <div class="text-center mt-3">
        <p class="auth-text">
          Don’t have an account?
          <a href="register.html" class="gold-link">Register</a>
        </p>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('login_password');
      const toggleBtn = document.getElementById('toggleLoginPassword');

      toggleBtn?.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = `<i class="bi bi-${isPassword ? 'eye-slash' : 'eye'}"></i>`;
      });
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
