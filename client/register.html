<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register | Sharp Cuts</title>

  <link rel="stylesheet" href="assets/css/style.css"/>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>

<body class="auth-page">
  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-header">
        <img src="assets/img/logo.png" alt="Sharp Cuts Logo" height="55"/>
        <h2>Create Account</h2>
        <p>Book & shop grooming products</p>
      </div>

      <form id="registerForm">

        <div class="row">
          <div class="col-6 mb-2">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" id="first_name" required/>
          </div>

          <div class="col-6 mb-2">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" id="last_name" required/>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required/>
        </div>

        <div class="mb-2">
          <label class="form-label">Phone</label>
          <input type="text" class="form-control" id="phone"/>
        </div>

        <div class="mb-2">
          <label class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" required/>
            <button type="button" class="btn" id="togglePassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label">Confirm Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="confirm_password" required/>
            <button type="button" class="btn" id="toggleConfirmPassword">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-gold w-100">
          Register
        </button>

      </form>

      <div class="text-center mt-3">
        <p class="auth-text">
          Already have an account?
          <a href="login.html" class="gold-link">Login</a>
        </p>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
  document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('registerForm');

    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm_password');

    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

    /* ───── Toggle Password ───── */
    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      togglePassword.innerHTML = `<i class="bi bi-${isPassword ? 'eye-slash' : 'eye'}"></i>`;
    });

    toggleConfirmPassword.addEventListener('click', () => {
      const isPassword = confirmPasswordInput.type === 'password';
      confirmPasswordInput.type = isPassword ? 'text' : 'password';
      toggleConfirmPassword.innerHTML = `<i class="bi bi-${isPassword ? 'eye-slash' : 'eye'}"></i>`;
    });

    /* ───── REGISTER SUBMIT ───── */
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = passwordInput.value;
      const confirm_password = confirmPasswordInput.value;

      if (password !== confirm_password) {
        Swal.fire("Error", "Passwords do not match", "error");
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            first_name,
            last_name,
            email,
            phone,
            password
          })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          Swal.fire("Error", data.message || "Registration failed", "error");
          return;
        }

        Swal.fire("Success", "Account created successfully", "success")
          .then(() => {
            window.location.href = "login.html";
          });

      } catch (err) {
        Swal.fire("Error", "Server error", "error");
      }
    });

  });
  </script>

</body>
</html>
