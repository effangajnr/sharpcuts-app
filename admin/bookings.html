<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sharp Cuts — Bookings</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

  <!-- Admin CSS -->
  <link rel="stylesheet" href="/admin/assets/css/admin.css">

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- AUTH CHECK -->
  <script>
    try {
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user"));

      if (!token || !user || user.role !== "admin") {
        window.location.href = "/admin/login.html";
      }

    } catch (err) {
      window.location.href = "/admin/login.html";
    }
  </script>
</head>

<body>

<!-- OVERLAY -->
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-scissors"></i></div>
    <div>
      <div class="brand-name">Sharp Cuts</div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/admin/index.html" class="nav-item">Dashboard</a>
    <a href="/admin/bookings.html" class="nav-item active">Bookings</a>
    <a href="/admin/orders.html" class="nav-item">Orders</a>
    <a href="/admin/barbers.html" class="nav-item">Barbers</a>
    <a href="/admin/services.html" class="nav-item">Services</a>
    <a href="/admin/service-categories.html" class="nav-item">Service Categories</a>
    <a href="/admin/products.html" class="nav-item">Products</a>
    <a href="/admin/testimonials.html" class="nav-item">Testimonials</a>
    <a href="/admin/users.html" class="nav-item">Users</a>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-avatar"><i class="bi bi-person-fill"></i></div>

    <div class="admin-info">
      <div class="admin-name" id="adminName"></div>
      <div class="admin-email" id="adminEmail"></div>
    </div>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>


<!-- TOPBAR -->
<header class="topbar">
  <span class="topbar-title">Bookings Management</span>
</header>

<!-- MAIN -->
<div class="main">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3>All Bookings</h3>
  </div>

  <table id="bookingsTable" class="display table">

    <thead>
      <tr>
        <th>ID</th>
        <th>Customer</th>
        <th>Barber</th>
        <th>Service</th>
        <th>Date</th>
        <th>Time</th>
        <th>Location</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="bookingsBody"></tbody>

  </table>

</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let table;

/* ============================= */
/* PAGE LOAD */
/* ============================= */
window.addEventListener('DOMContentLoaded', () => {

  const user = JSON.parse(localStorage.getItem("user") || "{}");

  document.getElementById("adminName").textContent =
    user.first_name
      ? `${user.first_name} ${user.last_name}`
      : "Admin";

  document.getElementById("adminEmail").textContent =
    user.email || "";

  loadBookings();
});


/* ============================= */
/* LOAD BOOKINGS */
/* ============================= */
async function loadBookings() {

  try {

    const res = await fetch('/api/bookings', {
      headers: {
        Authorization: 'Bearer ' + localStorage.getItem("token")
      }
    });

    const data = await res.json();

    console.log(data);

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Failed to fetch bookings');
    }

    const body = document.getElementById('bookingsBody');

    body.innerHTML = '';

    if (!data.data || data.data.length === 0) {

      body.innerHTML = `
        <tr>
          <td colspan="9" class="text-center py-4">
            No bookings found
          </td>
        </tr>
      `;

      return;
    }

    data.data.forEach(b => {

      body.innerHTML += `
        <tr>

          <td>${b.booking_id}</td>

          <td>
            ${b.customer_name || 'N/A'}
          </td>

          <td>
            ${b.barber_name || 'N/A'}
          </td>

          <td>
            ${b.service_name || 'N/A'}
          </td>

          <td>
            ${formatDate(b.booking_date)}
          </td>

          <td>
            ${b.booking_time || '-'}
          </td>

          <td>
            ${
              b.location_type === 'home_service'
                ? `
                  Home Service
                  <br>
                  <small>${b.service_address || ''}</small>
                `
                : 'In-Salon'
            }
          </td>

          <td>
            <span class="badge bg-${getStatusColor(b.status)}">
              ${capitalize(b.status)}
            </span>
          </td>

          <td>

            <div class="dropdown">

              <button
                class="btn btn-sm btn-dark dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Actions
              </button>

              <ul class="dropdown-menu dropdown-menu-end">

                ${
                  b.status === 'pending'
                  ? `
                    <li>
                      <a
                        class="dropdown-item"
                        href="#"
                        onclick="updateStatus(${b.booking_id}, 'confirmed')"
                      >
                        ✓ Confirm
                      </a>
                    </li>
                  `
                  : ''
                }

                ${
                  b.status === 'confirmed'
                  ? `
                    <li>
                      <a
                        class="dropdown-item"
                        href="#"
                        onclick="updateStatus(${b.booking_id}, 'completed')"
                      >
                        ✓ Complete
                      </a>
                    </li>
                  `
                  : ''
                }

                ${
                  b.status !== 'completed' &&
                  b.status !== 'cancelled'
                  ? `
                    <li>
                      <a
                        class="dropdown-item text-warning"
                        href="#"
                        onclick="updateStatus(${b.booking_id}, 'cancelled')"
                      >
                        ✗ Cancel
                      </a>
                    </li>
                  `
                  : ''
                }

                <li><hr class="dropdown-divider"></li>

                <li>
                  <a
                    class="dropdown-item text-danger"
                    href="#"
                    onclick="deleteBooking(${b.booking_id})"
                  >
                    🗑 Delete
                  </a>
                </li>

              </ul>

            </div>

          </td>

        </tr>
      `;
    });

    /* RESET DATATABLE */
    if ($.fn.DataTable.isDataTable('#bookingsTable')) {
      $('#bookingsTable').DataTable().destroy();
    }

    /* LOAD DATATABLE */
    table = $('#bookingsTable').DataTable({
      pageLength: 10,
      order: [[0, 'asc']]
    });

  } catch (err) {

    console.error(err);

    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: err.message
    });
  }
}


/* ============================= */
/* UPDATE STATUS */
/* ============================= */
async function updateStatus(id, status) {

  try {

    const res = await fetch(`/api/bookings/${id}`, {

      method: 'PUT',

      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + localStorage.getItem("token")
      },

      body: JSON.stringify({
        status
      })
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Update failed');
    }

    Swal.fire({
      icon: 'success',
      title: 'Updated',
      text: `Booking ${status}`
    });

    loadBookings();

  } catch (err) {

    console.error(err);

    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: err.message
    });
  }
}


/* ============================= */
/* DELETE BOOKING */
/* ============================= */
async function deleteBooking(id) {

  const confirm = await Swal.fire({
    title: 'Delete booking?',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Yes'
  });

  if (!confirm.isConfirmed) return;

  try {

    const res = await fetch(`/api/bookings/${id}`, {

      method: 'DELETE',

      headers: {
        Authorization: 'Bearer ' + localStorage.getItem("token")
      }
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      throw new Error(data.message || 'Delete failed');
    }

    Swal.fire({
      icon: 'success',
      title: 'Deleted',
      text: 'Booking deleted'
    });

    loadBookings();

  } catch (err) {

    console.error(err);

    Swal.fire({
      icon: 'error',
      title: 'Error',
      text: err.message
    });
  }
}


/* ============================= */
/* HELPERS */
/* ============================= */

function capitalize(str) {

  if (!str) return '';

  return str.charAt(0).toUpperCase() + str.slice(1);
}

function formatDate(date) {

  if (!date) return '-';

  return new Date(date).toLocaleDateString();
}

function getStatusColor(status) {

  switch(status) {

    case 'pending':
      return 'secondary';

    case 'confirmed':
      return 'primary';

    case 'completed':
      return 'success';

    case 'cancelled':
      return 'danger';

    default:
      return 'dark';
  }
}


/* ============================= */
/* LOGOUT */
/* ============================= */
function logout() {

  localStorage.removeItem("token");
  localStorage.removeItem("user");

  window.location.href = "/admin/login.html";
}

</script>

</body>
</html>
