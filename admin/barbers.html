<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp Cuts — Barbers</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    try {
      const token = localStorage.getItem("token");
      const user  = JSON.parse(localStorage.getItem("user") || "null");

      if (!token || !user || user.role !== "admin") {
        window.location.href = "/admin/login.html";
      }
    } catch {
      window.location.href = "/admin/login.html";
    }
  </script>
</head>

<body>
  <!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-scissors"></i></div>
    <div>
      <div class="brand-name">Sharp Cuts</div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/admin/index.html" class="nav-item">Dashboard</a>
    <a href="/admin/bookings.html" class="nav-item">Bookings</a>
    <a href="/admin/orders.html" class="nav-item">Orders</a>
    <a href="/admin/barbers.html" class="nav-item active">Barbers</a>
    <a href="/admin/services.html" class="nav-item">Services</a>
    <a href="/admin/service-categories.html" class="nav-item ">Service Categories</a>
    <a href="/admin/products.html" class="nav-item">Products</a>
    <a href="/admin/testimonials.html" class="nav-item">Testimonials</a>
    <a href="/admin/users.html" class="nav-item">Users</a>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-avatar"><i class="bi bi-person-fill"></i></div>

    <div class="admin-info">
      <div class="admin-name" id="adminName"></div>
      <div class="admin-email" id="adminEmail"></div>
    </div>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>


<div class="main">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Barbers</h3>
    <button class="btn btn-warning" onclick="openModal()">+ Add Barber</button>
  </div>

  <table id="barbersTable" class="display table">
    <thead>
      <tr>
        <th>#</th>
        <th>User</th>
        <th>Bio</th>
        <th>Experience</th>
        <th>Image</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="barbersBody"></tbody>
  </table>

</div>

<!-- MODAL -->
<div class="modal fade" id="barberModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Barber</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label>Select Staff User</label>
          <select class="form-select" id="fUserId"></select>
        </div>

        <div class="mb-3">
          <label>Bio</label>
          <textarea class="form-control" id="fBio"></textarea>
        </div>

        <div class="mb-3">
          <label>Experience (years)</label>
          <input type="number" class="form-control" id="fExperience">
        </div>

        <!-- MULTER IMAGE -->
        <div class="mb-3">
          <label>Barber Image</label>
          <input type="file" class="form-control" id="fImage" accept="image/*">
        </div>

        <div class="mb-3">
          <label>Status</label>
          <select class="form-select" id="fActive">
            <option value="true">Active</option>
            <option value="false">Inactive</option>
          </select>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="saveBarber()">Save</button>
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

let editId = null;
let barbers = [];
let modal = new bootstrap.Modal(document.getElementById('barberModal'));

/* ───────── TOKEN ───────── */
function getToken() {
  return localStorage.getItem("token");
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = "/admin/login.html";
}

// Optional: fill admin info safely
const user = JSON.parse(localStorage.getItem("user") || "null");

if (user) {
  document.getElementById("adminName").innerText =
    user.first_name ? `${user.first_name} ${user.last_name}` : "Admin";

  document.getElementById("adminEmail").innerText =
    user.email || "";
}

/* ───────── LOAD STAFF USERS ───────── */
async function loadStaffUsers() {

  try {

    const res = await fetch('/api/users', {
      headers: {
        Authorization: 'Bearer ' + getToken()
      }
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.message);
    }

    const staff = data.data.filter(u => u.role === 'staff');

    document.getElementById('fUserId').innerHTML = `
      <option value="">Select Staff User</option>
      ${staff.map(user => `
        <option value="${user.user_id}">
          ${user.first_name} ${user.last_name}
        </option>
      `).join('')}
    `;

  } catch (err) {

    console.error(err);

    Swal.fire(
      'Error',
      'Failed to load staff users',
      'error'
    );
  }
}

/* ───────── LOAD BARBERS ───────── */
async function loadBarbers() {

  try {

    const res = await fetch('/api/barbers', {
      headers: {
        Authorization: 'Bearer ' + getToken()
      }
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.message);
    }

    barbers = data.data;

    document.getElementById('barbersBody').innerHTML = barbers.map((b, i) => `
      <tr>
        <td>${i + 1}</td>

        <td>
          ${b.first_name} ${b.last_name}
        </td>

        <td>
          ${b.bio || '-'}
        </td>

        <td>
          ${b.experience_years} yrs
        </td>

        <td>
          ${
            b.image_url
            ? `<img src="${b.image_url}" width="50" height="50" style="object-fit:cover;border-radius:50%;">`
            : '-'
          }
        </td>

        <td>
          <span class="badge ${b.is_active ? 'bg-success' : 'bg-secondary'}">
            ${b.is_active ? 'Active' : 'Inactive'}
          </span>
        </td>

        <td>

          <button
            class="btn btn-sm btn-outline-secondary"
            onclick="openModal(${b.barber_id})"
          >
            <i class="bi bi-pencil"></i>
          </button>

          <button
            class="btn btn-sm btn-danger"
            onclick="deleteBarber(${b.barber_id})"
          >
            <i class="bi bi-trash"></i>
          </button>

        </td>
      </tr>
    `).join('');

    /* DESTROY OLD DATATABLE */
    if ($.fn.DataTable.isDataTable('#barbersTable')) {
      $('#barbersTable').DataTable().destroy();
    }

    /* RELOAD DATATABLE */
    $('#barbersTable').DataTable({
      pageLength: 10
    });

  } catch (err) {

    console.error(err);

    Swal.fire(
      'Error',
      'Failed to load barbers',
      'error'
    );
  }
}

/* ───────── INIT ───────── */
(async function init() {
  await loadStaffUsers();
  await loadBarbers();
})();

/* ───────── OPEN MODAL ───────── */
function openModal(id = null) {

  editId = id;

  resetForm();

  if (id !== null) {

    const b = barbers.find(x =>
      Number(x.barber_id) === Number(id)
    );

    if (!b) {
      Swal.fire('Error', 'Barber not found', 'error');
      return;
    }

    document.getElementById('modalTitle').innerText = 'Edit Barber';

    fUserId.value = b.user_id || '';
    fBio.value = b.bio || '';
    fExperience.value = b.experience_years || '';
    fActive.value = b.is_active ? 'true' : 'false';

  } else {

    document.getElementById('modalTitle').innerText = 'Add Barber';
  }

  modal.show();
}

/* ───────── RESET FORM ───────── */
function resetForm() {

  fUserId.value = '';
  fBio.value = '';
  fExperience.value = '';
  fImage.value = '';
  fActive.value = 'true';
}

/* ───────── SAVE BARBER ───────── */
async function saveBarber() {

  try {

    const formData = new FormData();

    formData.append('user_id', fUserId.value);
    formData.append('bio', fBio.value);
    formData.append('experience_years', fExperience.value);
    formData.append(
      'is_active',
      fActive.value === 'true'
    );

    const file = fImage.files[0];

    if (file) {
      formData.append('image', file);
    }

    const res = await fetch(
      editId
        ? `/api/barbers/${editId}`
        : '/api/barbers',
      {
        method: editId ? 'PUT' : 'POST',

        headers: {
          Authorization: 'Bearer ' + getToken()
        },

        body: formData
      }
    );

    const data = await res.json();

    if (!res.ok || !data.success) {

      Swal.fire(
        'Error',
        data.message || 'Failed to save barber',
        'error'
      );

      return;
    }

    modal.hide();

    await loadBarbers();

    Swal.fire(
      'Success',
      editId ? 'Barber updated' : 'Barber created',
      'success'
    );

  } catch (err) {

    console.error(err);

    Swal.fire(
      'Error',
      'Server error',
      'error'
    );
  }
}

/* ───────── DELETE BARBER ───────── */
async function deleteBarber(id) {

  const confirm = await Swal.fire({
    title: 'Delete barber?',
    icon: 'warning',
    showCancelButton: true,
    confirmButtonText: 'Yes'
  });

  if (!confirm.isConfirmed) return;

  try {

    const res = await fetch(`/api/barbers/${id}`, {
      method: 'DELETE',
      headers: {
        Authorization: 'Bearer ' + getToken()
      }
    });

    const data = await res.json();

    if (!data.success) {

      Swal.fire(
        'Error',
        data.message,
        'error'
      );

      return;
    }

    await loadBarbers();

    Swal.fire(
      'Deleted',
      'Barber removed',
      'success'
    );

  } catch (err) {

    console.error(err);

    Swal.fire(
      'Error',
      'Server error',
      'error'
    );
  }
}

</script>

</body>
</html>
