<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp Cuts — Service Categories</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

  <!-- Admin CSS -->
  <link rel="stylesheet" href="/admin/assets/css/admin.css">

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Auth check (optional remove if no auth yet) -->
  <script>
    try {
      const token = localStorage.getItem("token");
      const user  = JSON.parse(localStorage.getItem("user") || "null");

      if (!token || !user || user.role !== "admin") {
        window.location.href = "/admin/login.html";
      }
    } catch {
      window.location.href = "/admin/login.html";
    }
  </script>
</head>

<body>

  <!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-scissors"></i></div>
    <div>
      <div class="brand-name">Sharp Cuts</div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/admin/index.html" class="nav-item">Dashboard</a>
    <a href="/admin/bookings.html" class="nav-item">Bookings</a>
    <a href="/admin/orders.html" class="nav-item">Orders</a>
    <a href="/admin/barbers.html" class="nav-item">Barbers</a>
    <a href="/admin/services.html" class="nav-item">Services</a>
    <a href="/admin/service-categories.html" class="nav-item active">Service Categories</a>
    <a href="/admin/products.html" class="nav-item">Products</a>
    <a href="/admin/testimonials.html" class="nav-item">Testimonials</a>
    <a href="/admin/users.html" class="nav-item">Users</a>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-avatar"><i class="bi bi-person-fill"></i></div>

    <div class="admin-info">
      <div class="admin-name" id="adminName"></div>
      <div class="admin-email" id="adminEmail"></div>
    </div>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>

<div class="main p-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Service Categories</h3>
    <button class="btn btn-warning" onclick="openModal()">+ Add Category</button>
  </div>

  <table id="categoryTable" class="display table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="categoryBody"></tbody>
  </table>

</div>


<!-- MODAL -->
<div class="modal fade" id="categoryModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add Category</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">Category Name</label>
          <input class="form-control" id="fName" placeholder="e.g. Hair, Beard">
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="saveCategory()">Save</button>
      </div>

    </div>
  </div>
</div>


<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>


<script>

let editId = null;
let categories = [];
let table;

const modal = new bootstrap.Modal(document.getElementById('categoryModal'));

function getToken() {
  return localStorage.getItem("token");
}


/* ───────── LOAD CATEGORIES ───────── */
async function loadCategories() {
  try {

    const res = await fetch("/api/service-categories");
    const data = await res.json();

    if (!data.success) {
      Swal.fire("Error", "Failed to load categories", "error");
      return;
    }

    categories = data.data;

    document.getElementById("categoryBody").innerHTML = categories.map((c, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${c.name}</td>
        <td>
          <button class="btn btn-outline-secondary btn-sm" onclick="openModal(${c.category_id})">
            <i class="bi bi-pencil"></i>
          </button>

          <button class="btn btn-danger btn-sm" onclick="deleteCategory(${c.category_id})">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      </tr>
    `).join("");

    if ($.fn.DataTable.isDataTable('#categoryTable')) {
      $('#categoryTable').DataTable().destroy();
    }

    table = $('#categoryTable').DataTable();

  } catch (err) {
    Swal.fire("Error", "Server error", "error");
  }
}


/* ───────── OPEN MODAL ───────── */
function openModal(id = null) {
  editId = id;
  fName.value = "";

  if (id) {
    const c = categories.find(x => x.category_id === id);
    document.getElementById("modalTitle").innerText = "Edit Category";
    fName.value = c.name;
  } else {
    document.getElementById("modalTitle").innerText = "Add Category";
  }

  modal.show();
}


/* ───────── SAVE CATEGORY ───────── */
async function saveCategory() {

  const body = {
    name: fName.value.trim()
  };

  if (!body.name) {
    Swal.fire("Warning", "Name required", "warning");
    return;
  }

  try {

    const res = await fetch(
      editId ? `/api/service-categories/${editId}` : "/api/service-categories",
      {
        method: editId ? "PUT" : "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + getToken()
        },
        body: JSON.stringify(body)
      }
    );

    const data = await res.json();

    if (!data.success) {
      Swal.fire("Error", "Operation failed", "error");
      return;
    }

    modal.hide();
    loadCategories();

    Swal.fire({
      icon: "success",
      title: editId ? "Updated" : "Created",
      timer: 1200,
      showConfirmButton: false
    });

  } catch {
    Swal.fire("Error", "Server error", "error");
  }
}


/* ───────── DELETE CATEGORY ───────── */
async function deleteCategory(id) {

  const confirm = await Swal.fire({
    title: "Delete category?",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#d33"
  });

  if (!confirm.isConfirmed) return;

  await fetch(`/api/service-categories/${id}`, {
    method: "DELETE",
    headers: {
      Authorization: "Bearer " + getToken()
    }
  });

  loadCategories();

  Swal.fire("Deleted", "", "success");
}


loadCategories();

</script>

</body>
</html>
