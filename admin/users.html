<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp Cuts — Users</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="/admin/assets/css/admin.css">

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Auth check -->
  <script>
    try {
      const token = localStorage.getItem("token");
      const user  = JSON.parse(localStorage.getItem("user") || "null");

      if (!token || !user || user.role !== "admin") {
        window.location.href = "/admin/login.html";
      }
    } catch {
      window.location.href = "/admin/login.html";
    }
  </script>

</head>

<body>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-scissors"></i></div>
    <div>
      <div class="brand-name">Sharp Cuts</div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/admin/index.html" class="nav-item">Dashboard</a>
    <a href="/admin/bookings.html" class="nav-item">Bookings</a>
    <a href="/admin/orders.html" class="nav-item">Orders</a>
    <a href="/admin/barbers.html" class="nav-item">Barbers</a>
    <a href="/admin/services.html" class="nav-item">Services</a>
    <a href="/admin/service-categories.html" class="nav-item">Service Categories</a>
    <a href="/admin/products.html" class="nav-item">Products</a>
    <a href="/admin/testimonials.html" class="nav-item">Testimonials</a>
    <a href="/admin/users.html" class="nav-item active">Users</a>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-avatar"><i class="bi bi-person-fill"></i></div>

    <div class="admin-info">
      <div class="admin-name" id="adminName"></div>
      <div class="admin-email" id="adminEmail"></div>
    </div>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>


<!-- TOPBAR -->
<header class="topbar">
  <span class="topbar-title">Users</span>
</header>

<div class="main">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Users</h3>
    <button class="btn btn-warning" onclick="openModal()">+ Add User</button>
  </div>

  <table id="usersTable" class="display table">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="usersBody"></tbody>
  </table>

</div>

<!-- MODAL (Bootstrap) -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="modalTitle">Add User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <div class="mb-3">
          <label class="form-label">First Name</label>
          <input class="form-control" id="fFirst">
        </div>

        <div class="mb-3">
          <label class="form-label">Last Name</label>
          <input class="form-control" id="fLast">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" id="fEmail">
        </div>

        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input class="form-control" id="fPhone">
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select class="form-select" id="fRole">
            <option value="user">User</option>
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="fPassword">
          <small class="text-muted">Leave blank when editing to keep current password</small>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" onclick="saveUser()">Save</button>
      </div>

    </div>
  </div>
</div>

<!-- JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
let editId = null;
let users = [];
let table;
const modal = new bootstrap.Modal(document.getElementById('userModal'));

function getToken() {
  return localStorage.getItem("token");
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = "/admin/login.html";
}

const user = JSON.parse(localStorage.getItem("user") || "null");

if (user) {
  document.getElementById("adminName").innerText =
    user.first_name ? `${user.first_name} ${user.last_name}` : "Admin";

  document.getElementById("adminEmail").innerText =
    user.email || "";
}

// LOAD USERS
async function loadUsers() {
  try {
    const res = await fetch("/api/users", {
      headers: { Authorization: "Bearer " + getToken() }
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      Swal.fire("Error", data.message || "Failed to load users", "error");
      return;
    }

    users = data.data;

    document.getElementById("usersBody").innerHTML = users.map((u, i) => `
      <tr>
        <td>${i + 1}</td>
        <td>${u.first_name} ${u.last_name}</td>
        <td>${u.email}</td>
        <td>${u.phone || "-"}</td>
        <td>${u.role}</td>
        <td>
          <button class="btn btn-outline-secondary btn-sm" onclick="openModal(${u.user_id})">
            <i class="bi bi-pencil-fill"></i>
          </button>

          <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.user_id})">
            <i class="bi bi-trash-fill"></i>
          </button>
        </td>
      </tr>
    `).join("");

    if ($.fn.DataTable.isDataTable('#usersTable')) {
    $('#usersTable').DataTable().clear().destroy();
    }

    table = $('#usersTable').DataTable({
    pageLength: 10
    });

  } catch (err) {
    Swal.fire("Error", "Server error", "error");
  }
}

// OPEN MODAL
function openModal(id = null) {
  editId = id;
  resetForm();

  if (id) {
    const u = users.find(x => x.user_id === id);

    document.getElementById("modalTitle").innerText = "Edit User";

    fFirst.value = u.first_name;
    fLast.value  = u.last_name;
    fEmail.value = u.email;
    fPhone.value = u.phone;
    fRole.value  = u.role;
  } else {
    document.getElementById("modalTitle").innerText = "Add User";
  }

  modal.show();
}

// RESET
function resetForm() {
  fFirst.value = "";
  fLast.value = "";
  fEmail.value = "";
  fPhone.value = "";
  fPassword.value = "";
  fRole.value = "user";
}

// SAVE USER
async function saveUser() {
  const first = fFirst.value.trim();
  const last  = fLast.value.trim();
  const email = fEmail.value.trim();
  const phone = fPhone.value.trim();
  const role  = fRole.value;
  const password = fPassword.value;

  if (!first || !last || !email) {
    Swal.fire("Warning", "Please fill all required fields", "warning");
    return;
  }

  if (!editId && !password) {
    Swal.fire("Warning", "Password required for new user", "warning");
    return;
  }

  const body = { first_name:first, last_name:last, email, phone, role };
  if (password) body.password = password;

  try {
    const res = await fetch(editId ? `/api/users/${editId}` : "/api/users", {
      method: editId ? "PUT" : "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + getToken()
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      Swal.fire("Error", data.message || "Operation failed", "error");
      return;
    }

    modal.hide();
    loadUsers();

    Swal.fire({
      icon: "success",
      title: editId ? "User updated" : "User created",
      timer: 1500,
      showConfirmButton: false
    });

  } catch {
    Swal.fire("Error", "Server error", "error");
  }
}

// DELETE USER
async function deleteUser(id) {
  const confirm = await Swal.fire({
    title: "Delete user?",
    text: "This action cannot be undone",
    icon: "warning",
    showCancelButton: true,
    confirmButtonColor: "#d33",
    confirmButtonText: "Yes, delete"
  });

  if (!confirm.isConfirmed) return;

  try {
    const res = await fetch(`/api/users/${id}`, {
      method: "DELETE",
      headers: { Authorization: "Bearer " + getToken() }
    });

    const data = await res.json();

    if (!res.ok || !data.success) {
      Swal.fire("Error", data.message || "Delete failed", "error");
      return;
    }

    loadUsers();

    Swal.fire({
      icon: "success",
      title: "User deleted",
      timer: 1200,
      showConfirmButton: false
    });

  } catch {
    Swal.fire("Error", "Server error", "error");
  }
}

// INIT
loadUsers();
</script>

</body>
</html>
