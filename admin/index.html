<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharp Cuts — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/admin/assets/css/admin.css">

  <script>
    try {
      const token = localStorage.getItem("token");
      const user = JSON.parse(localStorage.getItem("user") || "null");

      if (!token || !user || user.role !== "admin") {
        window.location.href = "/admin/login.html";
      }
    } catch (err) {
      window.location.href = "/admin/login.html";
    }
  </script>
</head>

<body>

<!-- Overlay -->
<div class="overlay" id="overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon"><i class="bi bi-scissors"></i></div>
    <div>
      <div class="brand-name">Sharp Cuts</div>
      <div class="brand-sub">Admin Panel</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/admin/index.html" class="nav-item active">Dashboard</a>
    <a href="/admin/bookings.html" class="nav-item">Bookings</a>
    <a href="/admin/orders.html" class="nav-item">Orders</a>
    <a href="/admin/barbers.html" class="nav-item">Barbers</a>
    <a href="/admin/services.html" class="nav-item">Services</a>
    <a href="/admin/service-categories.html" class="nav-item">Service Categories</a>
    <a href="/admin/products.html" class="nav-item">Products</a>
    <a href="/admin/testimonials.html" class="nav-item">Testimonials</a>
    <a href="/admin/users.html" class="nav-item">Users</a>
  </nav>

  <div class="sidebar-footer">
    <div class="admin-avatar"><i class="bi bi-person-fill"></i></div>

    <div class="admin-info">
      <div class="admin-name" id="adminName"></div>
      <div class="admin-email" id="adminEmail"></div>
    </div>

    <button class="logout-btn" onclick="logout()">
      <i class="bi bi-box-arrow-right"></i>
    </button>
  </div>
</aside>


<!-- TOPBAR -->
<header class="topbar">
  <span class="topbar-title">Dashboard</span>
</header>

<!-- MAIN -->
<main class="main">

  <div class="cards-grid">

    <div class="card">
      <div class="card-icon"><i class="bi bi-people-fill"></i></div>
      <div class="card-body">
        <div class="card-value">—</div>
        <div class="card-label">Customers</div>
      </div>
    </div>

    <div class="card">
      <div class="card-icon"><i class="bi bi-calendar2-check-fill"></i></div>
      <div class="card-body">
        <div class="card-value">—</div>
        <div class="card-label">Bookings</div>
      </div>
    </div>

    <div class="card">
      <div class="card-icon"><i class="bi bi-box-seam-fill"></i></div>
      <div class="card-body">
        <div class="card-value">—</div>
        <div class="card-label">Products</div>
      </div>
    </div>

        <div class="card">
      <div class="card-icon"><i class="bi bi-box-seam-fill"></i></div>
      <div class="card-body">
        <div class="card-value">—</div>
        <div class="card-label">Orders</div>
      </div>
    </div>

  </div>

</main>

<!-- JS -->
<script>
function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  window.location.href = "/admin/login.html";
}

// Optional: fill admin info safely
const user = JSON.parse(localStorage.getItem("user") || "null");

if (user) {
  document.getElementById("adminName").innerText =
    user.first_name ? `${user.first_name} ${user.last_name}` : "Admin";

  document.getElementById("adminEmail").innerText =
    user.email || "";
}


// Load dashboard counts
async function loadCounts() {
  const res = await fetch('/api/dashboard/counts');
  const data = await res.json();

  document.querySelectorAll('.card-value')[0].innerText = data.data.customers;
  document.querySelectorAll('.card-value')[1].innerText = data.data.bookings;
  document.querySelectorAll('.card-value')[2].innerText = data.data.products;
  document.querySelectorAll('.card-value')[3].innerText = data.data.orders;
}

loadCounts();

</script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/admin/assets/js/dashboard.js"></script>

</body>
</html>
